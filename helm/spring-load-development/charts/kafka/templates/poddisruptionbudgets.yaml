{{- if and .Values.podDisruptionBudget.enabled .Values.kafka.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kafka-pdb
  namespace: {{ .Values.kafka.namespace }}
  labels:
    app: kafka
    {{- include "kafka.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.kafka.minAvailable | default 0 }}
  selector:
    matchLabels:
      app: kafka
{{- end }}
