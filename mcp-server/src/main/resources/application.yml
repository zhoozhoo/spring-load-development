spring:
  application:
    name: mcp-server
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888/}

loaddev:
  events:
    kafka:
      enabled: true
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    component-read-model:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: kubernetes
    import: "kubernetes:"
  cloud:
    config:
      enabled: false
    kubernetes:
      config:
        sources:
          - name: common-config
          - name: mcp-server-config
      discovery:
        all-namespaces: true
